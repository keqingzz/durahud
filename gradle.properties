org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.warning.mode=none

minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11
fabric_version=0.92.6+1.20.1

# Trinkets 只在编译期使用（可选，见 build.gradle 注释）。指向本机 Trinkets 3.7.2 的 mod jar。
# 注意：gradle.properties 是按 ISO-8859-1 读取的，所以这些路径要写成「相对工程目录 + 纯 ASCII」；
# 路径里出现中文目录名时，属性文件里会变成乱码，loom 就找不到 jar 了。
trinkets_jar=../libs/trinkets-3.7.2.jar
# trinkets 的 jar-in-jar 依赖（cardinal-components），用下面的脚本从 trinkets 的 jar 里抽出来：
#   node tools/extract-cca.mjs <trinkets.jar> <输出目录>
cca_base_jar=../libs/cardinal-components-base-5.2.0.jar
cca_entity_jar=../libs/cardinal-components-entity-5.2.0.jar

mod_version=2.1.5
maven_group=dev.durahud
archives_base_name=durahud
